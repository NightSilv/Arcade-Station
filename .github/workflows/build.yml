name: Build Arcade Station

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      FBNEO_SHA: 2cfc5f304fe8b1db65e464efaa50fa46f273c472
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install requirements
        run: |
          sudo apt-get update
          sudo apt-get -y install gcc g++ libelf-dev autoconf automake bison flex make texinfo patch wget zlib1g-dev libtool-bin bzip2 pkg-config libssl-dev p7zip-full perl

      - name: Download PS3 SDK (ps3dev)
        run: |
          set -e
          pick() {
            gh api "repos/$1/releases?per_page=40" --jq '
              [ .[] | select(.draft | not) | .assets[]?
                | select(.name | test("ubuntu|linux"; "i"))
                | select(.name | test("\\.tar\\.gz$"))
                | select(.name | test("mac|osx|win|arm|aarch"; "i") | not) ]
              | .[0].browser_download_url // empty'
          }
          for repo in ps3dev/ps3dev ps3dev/ps3toolchain; do
            echo "=== releases de $repo"
            gh api "repos/$repo/releases?per_page=15" --jq '.[] | "\(.tag_name) pre=\(.prerelease) :: \([.assets[].name] | join(", "))"' || true
          done
          URL=$(pick ps3dev/ps3dev)
          FULL=1
          if [ -z "$URL" ]; then
            URL=$(pick ps3dev/ps3toolchain)
            FULL=0
          fi
          if [ -z "$URL" ]; then
            echo "::error::No encontre ningun SDK de PS3 precompilado para Linux"
            exit 1
          fi
          echo "Descargando: $URL (sdk completo = $FULL)"
          curl -fL --retry 3 "$URL" -o sdk.tar.gz
          tar xzf sdk.tar.gz -C "$GITHUB_WORKSPACE"
          echo "PS3DEV=$GITHUB_WORKSPACE/ps3dev" >> "$GITHUB_ENV"
          echo "PSL1GHT=$GITHUB_WORKSPACE/ps3dev" >> "$GITHUB_ENV"
          echo "PATH=$PATH:$GITHUB_WORKSPACE/ps3dev/bin:$GITHUB_WORKSPACE/ps3dev/ppu/bin:$GITHUB_WORKSPACE/ps3dev/spu/bin" >> "$GITHUB_ENV"
          echo "SDK_FULL=$FULL" >> "$GITHUB_ENV"

      - name: Build PSL1GHT (solo si el SDK descargado no lo trae)
        run: |
          set -e
          if [ ! -f "$PSL1GHT/ppu_rules" ] || [ ! -f "$PS3DEV/ppu/lib/libnet.a" ]; then
            echo "El SDK no trae PSL1GHT completo, lo compilo desde el codigo fuente"
            git clone --depth 1 https://github.com/ps3dev/PSL1GHT.git psl1ght-src
            cd psl1ght-src
            make install-ctrl
            make
            make install
          fi

      - name: Comprobar SDK
        run: |
          test -x "$PS3DEV/ppu/bin/ppu-gcc" || { echo "::error::Falta ppu-gcc"; exit 1; }
          test -f "$PSL1GHT/ppu_rules"      || { echo "::error::Falta ppu_rules"; exit 1; }
          ppu-gcc --version | head -1
          ppu-g++ --version | head -1

      - name: Bajar FBNeo (commit fijado)
        run: |
          set -e
          mkdir fbneo
          cd fbneo
          git init -q
          git remote add origin https://github.com/libretro/FBNeo.git
          git fetch --depth 1 origin "$FBNEO_SHA"
          git checkout -q FETCH_HEAD
          git log -1 --format=%H

      - name: Recuperar objetos ya compilados (cache)
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: fbneo/src
          key: fbneo-objs-${{ env.FBNEO_SHA }}-v2
          restore-keys: fbneo-objs-${{ env.FBNEO_SHA }}-v2-
        continue-on-error: true

      - name: Parches para PS3 (se aplican DESPUES de recuperar la cache; si ya estan puestos no se toca nada)
        run: |
          set -e
          cd fbneo/src
          # 1) zlib: PSL1GHT define __MACTYPES__ y zconf.h entonces no declara 'Byte'
          if ! grep -q "parche PS3" dep/libs/zlib/zconf.h; then
            sed -i 's/^#if !defined(__MACTYPES__)$/#if 1  \/* parche PS3: Byte siempre *\//' dep/libs/zlib/zconf.h
          fi
          grep -n "parche PS3" dep/libs/zlib/zconf.h
          # 2) plutosvg: PSL1GHT no tiene sys/mman.h; se apaga solo la carga de fuentes desde archivo (no se usa)
          if ! grep -q "PLUTOVG_DISABLE_FONT_FACE_CACHE_LOAD" dep/libs/plutosvg/plutosvg_all.c; then
            sed -i '1i #define PLUTOVG_DISABLE_FONT_FACE_CACHE_LOAD' dep/libs/plutosvg/plutosvg_all.c
          fi
          head -2 dep/libs/plutosvg/plutosvg_all.c
          # 3) libretro-common: con STATIC_LINKING=1 FBNeo NO lo incluye (espera que lo ponga RetroArch). Aqui no hay RetroArch:
          #    se fuerza a incluirlo (rfopen, rfseek, filestream_*, path_*, etc. quedan dentro del nucleo)
          if ! grep -q "parche PS3: el nucleo debe llevar su libretro-common" burner/libretro/Makefile.common; then
            sed -i 's/^ifneq (\$(STATIC_LINKING), 1)$/ifneq (0,1)   # parche PS3: el nucleo debe llevar su libretro-common/' burner/libretro/Makefile.common
            # parche PS3: una sola entrada TOC por objeto (evita "relocation truncated to fit: R_PPC64_TOC16_DS")
            grep -q "mminimal-toc" burner/libretro/Makefile || sed -i "s/^\tPLATFORM_DEFINES += -D__PS3__\$/\tPLATFORM_DEFINES += -D__PS3__ -mminimal-toc/" burner/libretro/Makefile
          fi
          grep -n "parche PS3: el nucleo debe llevar su libretro-common" burner/libretro/Makefile.common

      - name: Compilar nucleo FBNeo completo con platform=psl1ght
        run: |
          # el makefile de FBNeo para PS3 no agrega la carpeta de cabeceras de PSL1GHT (lv2/systime.h, lv2/sysfs.h): se la damos por entorno
          export C_INCLUDE_PATH="$PS3DEV/ppu/include:$PSL1GHT/ppu/include"
          export CPLUS_INCLUDE_PATH="$PS3DEV/ppu/include:$PSL1GHT/ppu/include"
          ls "$PSL1GHT/ppu/include/lv2/systime.h" "$PSL1GHT/ppu/include/lv2/sysfs.h"
          cd fbneo/src/burner/libretro
          # make -k: si hay errores salen todos juntos en un solo intento
          set +e
          make -k platform=psl1ght -j"$(nproc)" 2>&1 | tee "$GITHUB_WORKSPACE/core_build.log"
          rc=${PIPESTATUS[0]}
          set -e
          grep -n "error" "$GITHUB_WORKSPACE/core_build.log" | head -60 || true
          test "$rc" = "0"

      - name: Guardar objetos compilados (cache)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: fbneo/src
          key: fbneo-objs-${{ env.FBNEO_SHA }}-v2-${{ github.run_id }}
        continue-on-error: true

      - name: Tamano del nucleo
        run: |
          cd fbneo/src/burner/libretro
          ls -la fbneo_libretro_psl1ght.a
          ppu-size fbneo_libretro_psl1ght.a 2>/dev/null | tail -1 || size fbneo_libretro_psl1ght.a | tail -1 || true

      - name: Crear config.txt de ejemplo
        run: |
          mkdir -p data/USRDIR
          cat > data/USRDIR/config.txt <<'CFG'
          # Arcade Station - configuracion
          # Los juegos (.zip de FBNeo, por ejemplo mwalk.zip) van en la carpeta roms/ dentro de USRDIR.
          # Los BIOS (por ejemplo neogeo.zip) van en esa MISMA carpeta roms/.
          # port: puerto TCP para el online (no se usa en la v0.1, que es solo local)
          port=7780
          # delay: 0 = automatico segun la latencia medida (online, v0.2)
          delay=0
          # public_ip: solo para el online (v0.2)
          public_ip=
          # res: vacio = 720p (por defecto) | auto = la resolucion de tu TV
          res=
          # render: vacio = cpu (por defecto, dibujo directo sin la GPU) | gpu = usa la GPU (se cuelga; no la uses)
          render=
          # zoom: vacio = automatico (1, 2, 3 o 4)
          zoom=
          # audio: vacio = con sonido | off = sin sonido (tambien se apaga manteniendo R2 al abrir)
          audio=
          CFG
          sed -i 's/^          //' data/USRDIR/config.txt
          cat data/USRDIR/config.txt

      - name: Diagnostico de librerias C++
        run: |
          find "$PS3DEV" -name "libstdc++.a" -o -name "libsupc++.a" | head || true
          echo "=== simbolos sysFs en el nucleo"
          nm -A fbneo/src/burner/libretro/fbneo_libretro_psl1ght.a 2>/dev/null | grep -iE " U sysFs" | head -10 || true

      - name: Compilar Arcade Station
        run: |
          set +e
          make -k -j"$(nproc)" pkg 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          set -e
          grep -n "error\|undefined reference" build.log | head -60 || true
          test "$rc" = "0"
          ls -la ArcadeStation*.pkg build/pkg/USRDIR/

      - name: Guardar paquetes
        uses: actions/upload-artifact@v4
        with:
          name: ArcadeStation
          path: |
            ArcadeStation.pkg
            ArcadeStation.gnpdrm.pkg
          if-no-files-found: error

      - name: Guardar registro
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registro-arcade-station
          path: |
            core_build.log
            build.log
          if-no-files-found: ignore
