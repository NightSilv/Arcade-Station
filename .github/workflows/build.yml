name: Build Arcade Station

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      FBA_SHA: 0ce31536bef3162fe7e69ff5f555334ec4913cef
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install requirements
        run: |
          sudo apt-get update
          sudo apt-get -y install gcc g++ libelf-dev autoconf automake bison flex make texinfo patch wget zlib1g-dev libtool-bin bzip2 pkg-config libssl-dev p7zip-full perl

      - name: Download PS3 SDK (ps3dev)
        run: |
          set -e
          pick() {
            gh api "repos/$1/releases?per_page=40" --jq '
              [ .[] | select(.draft | not) | .assets[]?
                | select(.name | test("ubuntu|linux"; "i"))
                | select(.name | test("\\.tar\\.gz$"))
                | select(.name | test("mac|osx|win|arm|aarch"; "i") | not) ]
              | .[0].browser_download_url // empty'
          }
          for repo in ps3dev/ps3dev ps3dev/ps3toolchain; do
            echo "=== releases de $repo"
            gh api "repos/$repo/releases?per_page=15" --jq '.[] | "\(.tag_name) pre=\(.prerelease) :: \([.assets[].name] | join(", "))"' || true
          done
          URL=$(pick ps3dev/ps3dev)
          FULL=1
          if [ -z "$URL" ]; then
            URL=$(pick ps3dev/ps3toolchain)
            FULL=0
          fi
          if [ -z "$URL" ]; then
            echo "::error::No encontre ningun SDK de PS3 precompilado para Linux"
            exit 1
          fi
          echo "Descargando: $URL (sdk completo = $FULL)"
          curl -fL --retry 3 "$URL" -o sdk.tar.gz
          tar xzf sdk.tar.gz -C "$GITHUB_WORKSPACE"
          echo "PS3DEV=$GITHUB_WORKSPACE/ps3dev" >> "$GITHUB_ENV"
          echo "PSL1GHT=$GITHUB_WORKSPACE/ps3dev" >> "$GITHUB_ENV"
          echo "PATH=$PATH:$GITHUB_WORKSPACE/ps3dev/bin:$GITHUB_WORKSPACE/ps3dev/ppu/bin:$GITHUB_WORKSPACE/ps3dev/spu/bin" >> "$GITHUB_ENV"
          echo "SDK_FULL=$FULL" >> "$GITHUB_ENV"

      - name: Build PSL1GHT (solo si el SDK descargado no lo trae)
        run: |
          set -e
          if [ ! -f "$PSL1GHT/ppu_rules" ] || [ ! -f "$PS3DEV/ppu/lib/libnet.a" ]; then
            echo "El SDK no trae PSL1GHT completo, lo compilo desde el codigo fuente"
            git clone --depth 1 https://github.com/ps3dev/PSL1GHT.git psl1ght-src
            cd psl1ght-src
            make install-ctrl
            make
            make install
          fi

      - name: Comprobar SDK
        run: |
          test -x "$PS3DEV/ppu/bin/ppu-gcc" || { echo "::error::Falta ppu-gcc"; exit 1; }
          test -f "$PSL1GHT/ppu_rules"      || { echo "::error::Falta ppu_rules"; exit 1; }
          ppu-gcc --version | head -1
          ppu-g++ --version | head -1

      - name: Bajar FB Alpha 2012 (commit fijado)
        run: |
          set -e
          mkdir fba
          cd fba
          git init -q
          git remote add origin https://github.com/libretro/fbalpha2012.git
          git fetch --depth 1 origin "$FBA_SHA"
          git checkout -q FETCH_HEAD
          git log -1 --format=%H
          ls svn-current/trunk | head -20

      - name: Recuperar objetos ya compilados (cache)
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: fba/svn-current/trunk/src
          key: fba2012-objs-${{ env.FBA_SHA }}-v1
          restore-keys: fba2012-objs-${{ env.FBA_SHA }}-v1-
        continue-on-error: true

      - name: Parches para PS3 y lista de juegos SOLO arcade (se aplican DESPUES de recuperar la cache; si ya estan puestos no se toca nada)
        run: |
          set -e
          cd fba/svn-current/trunk
          # 1) zlib: PSL1GHT define __MACTYPES__ y zconf.h entonces no declara 'Byte'
          if ! grep -q "parche PS3" src/dep/libs/zlib/zconf.h; then
            sed -i 's/^#if !defined(__MACTYPES__)$/#if 1  \/* parche PS3: Byte siempre *\//' src/dep/libs/zlib/zconf.h
          fi
          grep -n "parche PS3" src/dep/libs/zlib/zconf.h
          # 2) una sola entrada TOC por objeto (evita "relocation truncated to fit: R_PPC64_TOC16_DS")
          if ! grep -q "D__PS3__ -mminimal-toc" makefile.libretro; then
            sed -i 's/^    PLATFORM_DEFINES += -D__PS3__$/    PLATFORM_DEFINES += -D__PS3__ -mminimal-toc/' makefile.libretro
          fi
          grep -n "D__PS3__ -mminimal-toc" makefile.libretro
          # 3) Arcade Station: SOLO arcade. No se compilan consolas (Mega Drive, PC Engine, SNES) ni CPS3, y la lista de juegos se regenera
          #    solo con las carpetas de arcade (asi no queda ninguna referencia a codigo que no se compila)
          D=src/burn/drv
          perl src/dep/scripts/gamelist.pl -o src/dep/generated/driverlist.h -l "$RUNNER_TEMP/gamelist_arcade.txt" \
            $D/capcom $D/cave $D/dataeast $D/galaxian $D/irem $D/konami $D/neogeo $D/pgm $D/pre90s $D/psikyo $D/pst90s $D/sega $D/taito $D/toaplan
          ls -la src/dep/generated/driverlist.h
          grep -n "BurnDrvMWalk;" src/dep/generated/driverlist.h
          if grep -qE "BurnDrv(md_|pce_|tg_|sgx_|sms_|gg_)" src/dep/generated/driverlist.h; then
            echo "::error::La lista de juegos aun trae consolas"; exit 1
          fi
          # 4) Moonwalker (mwalk) viene marcado "no funciona" en FBA 2012 y el nucleo se niega a cargarlo (FBNeo si lo marca como funcionando).
          #    PRUEBA: se marca como funcionando para ver que hace. Puede verse mal, sin sonido o no andar.
          if ! grep -q "parche ArcadeStation mwalk" src/burn/drv/sega/d_sys18.cpp; then
            perl -0pi -e 's/("mwalk", NULL, NULL, NULL, "1990",\n[^\n]*\n[^\n]*\n)\t0, 3, /$1\t\/* parche ArcadeStation mwalk *\/ BDF_GAME_WORKING, 3, /' src/burn/drv/sega/d_sys18.cpp
          fi
          grep -q "parche ArcadeStation mwalk" src/burn/drv/sega/d_sys18.cpp || { echo "::error::No se pudo aplicar el parche de mwalk"; exit 1; }
          # 5) el nucleo ignora lo que devuelve BurnDrvInit: se anota en arcade.log
          if ! grep -q "rc_init = BurnDrvInit" src/burner/libretro/libretro.cpp; then
            perl -0pi -e 's/^   BurnDrvInit\(\);$/   { int rc_init = BurnDrvInit(); log_cb(RETRO_LOG_INFO, "[FBA] BurnDrvInit devolvio %d\\n", rc_init); }/m' src/burner/libretro/libretro.cpp
          fi
          grep -q "rc_init = BurnDrvInit" src/burner/libretro/libretro.cpp || { echo "::error::No se pudo aplicar el parche de BurnDrvInit"; exit 1; }
          # 6) CARGAR ESTADO en juegos CPS1 (sf2ce, etc.): el nucleo restaura el numero de banco del Z80 de sonido pero NO vuelve a mapear
          #    la ventana 0x8000-0xBFFF, asi que el Z80 sigue leyendo el banco de ANTES de cargar (suenan sonidos de otros niveles / golpes que no van).
          #    Se vuelve a mapear el banco justo despues de restaurarlo.
          if ! grep -q "parche ArcadeStation banco" src/burn/drv/capcom/ps_z.cpp; then
            perl -0pi -e 's/(\tSCAN_VAR\(nPsndZBank\);\n)/$1\t\/* parche ArcadeStation banco *\/ if (nAction & ACB_WRITE) { ZetOpen(0); PsndZBankMap(); ZetClose(); }\n/' src/burn/drv/capcom/ps_z.cpp
          fi
          grep -q "parche ArcadeStation banco" src/burn/drv/capcom/ps_z.cpp || { echo "::error::No se pudo aplicar el parche del banco Z80"; exit 1; }

      - name: Compilar nucleo FB Alpha 2012 (solo arcade) con platform=psl1ght
        run: |
          # PSL1GHT necesita sus cabeceras (lv2/systime.h, lv2/sysfs.h) en la ruta de includes
          export C_INCLUDE_PATH="$PS3DEV/ppu/include:$PSL1GHT/ppu/include"
          export CPLUS_INCLUDE_PATH="$PS3DEV/ppu/include:$PSL1GHT/ppu/include"
          cd fba/svn-current/trunk
          # make -k: si hay errores salen todos juntos en un solo intento
          set +e
          make -f makefile.libretro -k platform=psl1ght -j"$(nproc)" INCLUDE_7Z_SUPPORT=0 SNES_DIR= CPS3_DIR= MD_DIR= PCE_DIR= 2>&1 | tee "$GITHUB_WORKSPACE/core_build.log"
          rc=${PIPESTATUS[0]}
          set -e
          grep -n "error" "$GITHUB_WORKSPACE/core_build.log" | head -60 || true
          test "$rc" = "0"
          ls -la fbalpha2012_libretro_psl1ght.a

      - name: Guardar objetos compilados (cache)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: fba/svn-current/trunk/src
          key: fba2012-objs-${{ env.FBA_SHA }}-v1-${{ github.run_id }}
        continue-on-error: true

      - name: Crear config.txt de ejemplo
        run: |
          mkdir -p data/USRDIR
          cat > data/USRDIR/config.txt <<'CFG'
          # Arcade Station - configuracion
          # Los juegos (.zip de FB Alpha 2012, por ejemplo mwalk.zip) van en la carpeta roms/ dentro de USRDIR.
          # Los BIOS (por ejemplo neogeo.zip) van en esa MISMA carpeta roms/.
          # port: puerto TCP para el online (no se usa en la v0.1, que es solo local)
          port=7780
          # delay: 0 = automatico segun la latencia medida (online, v0.2)
          delay=0
          # public_ip: solo para el online (v0.2)
          public_ip=
          # res: vacio = 720p (por defecto) | auto = la resolucion de tu TV
          res=
          # render: vacio = cpu (por defecto, dibujo directo sin la GPU) | gpu = usa la GPU (se cuelga; no la uses)
          render=
          # zoom: vacio = automatico (1, 2, 3 o 4)
          zoom=
          # audio: vacio = con sonido | off = sin sonido (tambien se apaga manteniendo R2 al abrir)
          audio=
          CFG
          sed -i 's/^          //' data/USRDIR/config.txt
          cat data/USRDIR/config.txt

      - name: Compilar Arcade Station
        run: |
          set +e
          make -k -j"$(nproc)" pkg 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          set -e
          grep -n "error\|undefined reference" build.log | head -60 || true
          test "$rc" = "0"
          ls -la ArcadeStation*.pkg build/pkg/USRDIR/

      - name: Memoria del ejecutable (diagnostico, no rompe el build)
        if: always()
        continue-on-error: true
        run: |
          echo "=== tamano total del ejecutable (text data bss)"
          (ppu-size ArcadeStation.elf || size ArcadeStation.elf) 2>&1 || true
          echo "=== segmentos (MemSiz = memoria real que pide el programa)"
          (ppu-readelf -lW ArcadeStation.elf || readelf -lW ArcadeStation.elf) 2>&1 | head -30 || true
          echo "=== 25 simbolos mas grandes"
          (ppu-nm --size-sort -S ArcadeStation.elf || nm --size-sort -S ArcadeStation.elf) 2>&1 | tail -25 || true

      - name: Guardar paquetes
        uses: actions/upload-artifact@v4
        with:
          name: ArcadeStation
          path: |
            ArcadeStation.pkg
            ArcadeStation.gnpdrm.pkg
          if-no-files-found: error

      - name: Guardar registro
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registro-arcade-station
          path: |
            core_build.log
            build.log
          if-no-files-found: ignore
